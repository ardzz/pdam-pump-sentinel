<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="Peta jalan PC1: T2 jarak sepanjang jalan, Q jarak keluar dari jalan">
  <defs>
    <style>
      .title{font-family:Georgia,'Times New Roman',serif;font-weight:600;}
      .lbl{font-family:'DejaVu Sans','Verdana','Segoe UI',sans-serif;}
    </style>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#dd7e1f"/>
    </marker>
    <marker id="arrowCrim" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="560" fill="#f5f1e8"/>
  <rect x="8" y="8" width="864" height="544" rx="10" fill="none" stroke="#e4ded0" stroke-width="1"/>

  <text class="title" x="440" y="48" text-anchor="middle" font-size="26" fill="#27303a">Peta jalan PC1: T2 dan Q</text>
  <text class="lbl" x="440" y="78" text-anchor="middle" font-size="15" fill="#5b6671">PC1 = jalan normal. T2 = jarak sepanjang jalan. Q/SPE = jarak keluar dari jalan.</text>

  <!-- road -->
  <line x1="150" y1="430" x2="740" y2="180" stroke="#2a9d8f" stroke-width="38" stroke-linecap="round" opacity="0.20"/>
  <line x1="150" y1="430" x2="740" y2="180" stroke="#0b5d57" stroke-width="2.5" stroke-dasharray="14 12" opacity="0.85"/>
  <text class="lbl" x="654" y="201" text-anchor="middle" font-size="15" font-weight="600" fill="#0b5d57" transform="rotate(-22.96 654 201)">Jalan normal (PC1)</text>

  <!-- normal window cloud -->
  <g fill="#2a9d8f" opacity="0.5">
    <circle cx="205" cy="366" r="5"/>
    <circle cx="245" cy="350" r="5"/>
    <circle cx="188" cy="378" r="5"/>
    <circle cx="278" cy="335" r="5"/>
    <circle cx="225" cy="360" r="5"/>
    <circle cx="262" cy="344" r="5"/>
  </g>

  <!-- pusat normal -->
  <line x1="220" y1="407" x2="220" y2="456" stroke="#0b5d57" stroke-width="1" opacity="0.6"/>
  <circle cx="220" cy="400" r="7" fill="#0b5d57" stroke="#f5f1e8" stroke-width="2"/>
  <text class="lbl" x="220" y="473" text-anchor="middle" font-size="13" font-weight="600" fill="#0b5d57">pusat normal</text>

  <!-- T2 arrow: distance along the road -->
  <line x1="226" y1="415" x2="551" y2="278" stroke="#dd7e1f" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <text class="lbl" x="398" y="366" text-anchor="middle" font-size="15" font-weight="600" fill="#b5670f" transform="rotate(-22.96 398 366)">T2 = jarak sepanjang jalan</text>

  <!-- Q arrow: distance away from the road -->
  <line x1="545" y1="263" x2="494" y2="143" stroke="#c0392b" stroke-width="4" marker-end="url(#arrowCrim)"/>
  <polyline points="557.9,257.5 552.4,244.6 539.5,250.1" fill="none" stroke="#27303a" stroke-width="1.5"/>
  <line x1="556" y1="188" x2="524" y2="200" stroke="#a93226" stroke-width="1"/>
  <text class="lbl" x="560" y="184" text-anchor="start" font-size="14" font-weight="600" fill="#a93226">Q/SPE = jarak</text>
  <text class="lbl" x="560" y="202" text-anchor="start" font-size="14" font-weight="600" fill="#a93226">keluar dari jalan</text>

  <!-- window point -->
  <circle cx="494" cy="143" r="11" fill="#f5f1e8"/>
  <circle cx="494" cy="143" r="8" fill="#c0392b" stroke="#7d2018" stroke-width="1.5"/>
  <text class="lbl" x="494" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#27303a">titik window (baru)</text>

  <!-- legend -->
  <line x1="90" y1="516" x2="130" y2="516" stroke="#2a9d8f" stroke-width="6" stroke-linecap="round"/>
  <text class="lbl" x="138" y="520" text-anchor="start" font-size="13" fill="#5b6671">Jalan normal (PC1)</text>
  <line x1="352" y1="516" x2="388" y2="516" stroke="#dd7e1f" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <text class="lbl" x="396" y="520" text-anchor="start" font-size="13" fill="#5b6671">T2 (sepanjang jalan)</text>
  <line x1="606" y1="516" x2="642" y2="516" stroke="#c0392b" stroke-width="4" marker-end="url(#arrowCrim)"/>
  <text class="lbl" x="650" y="520" text-anchor="start" font-size="13" fill="#5b6671">Q/SPE (keluar jalan)</text>
</svg>
